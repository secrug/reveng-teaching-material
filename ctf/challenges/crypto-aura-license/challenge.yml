hints:
  - content: "Brute force is off the table (2^64). The validator DEcrypts your licence and compares to something — so work backwards: what plaintext must it produce, and can you encrypt that yourself?"
    cost: 30
  - content: "It's a 16-round Feistel network, so encryption is the same loop with the round keys reversed. You need three things exactly right: the S-box, the round function, and the key schedule."
    cost: 60
  - content: "It is NOT TEA. There is no delta constant, and the round keys are not the master key split into words — they come from a 64-bit LCG. Transcribe, don't assume."
    cost: 90
