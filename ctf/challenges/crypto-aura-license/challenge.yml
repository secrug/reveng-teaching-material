name: "Counterfeit"
author: "AURA-7 course team"
category: crypto
description: |
  Every AURA-7 unit ships locked until it sees a valid licence. We have the
  validator but not a single working licence — and the vendor is not returning
  our calls.

  Make one. The validator prints the flag when it accepts.

  `./aura-license` reads a 16-hex-character licence from stdin.
attribution: "Original challenge — AURA-7 course suite (original cipher, no public writeup exists)"
