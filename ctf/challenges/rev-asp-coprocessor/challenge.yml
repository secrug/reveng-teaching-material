hints:
  - content: "There are only three opcodes and none of them do arithmetic. So where does the arithmetic happen? Look at what a write to a high port does."
    cost: 40
  - content: "Some ports aren't storage or math — writing to them changes the program counter. That's how this machine branches. Find the loop and the exit condition."
    cost: 70
  - content: "Per byte: xor K1 -> rotate by (index & 7) -> add a term that grows by K4 each step -> xor K3. All reversible. The constants are in the MOVI immediates."
