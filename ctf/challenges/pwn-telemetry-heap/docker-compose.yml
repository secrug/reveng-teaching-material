services:
  telemetry-heap:
    build: .
    image: aura7/telemetry-heap:latest
    restart: unless-stopped
    ports: [ "9010:9010" ]
    mem_limit: 128m
    pids_limit: 128
    security_opt: [ "no-new-privileges:true" ]
    # TODO(prod): wrap the service in nsjail per-connection — see ../HOSTING.md
